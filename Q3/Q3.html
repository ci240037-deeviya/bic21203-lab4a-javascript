<!DOCTYPE html>
<html>
<body>

<h1>Dynamic Number Generator</h1>

<button id="generateBtn" type="button">Generate</button>

<ol id="numberList"></ol>

<script>
const button = document.getElementById("generateBtn");
const numberList = document.getElementById("numberList");

function generateNumbers() {
    numberList.textContent = "";

    for (let i = 1; i <= 5; i++) {
        const item = document.createElement("li");

        item.textContent = "The number is " + i;

        numberList.appendChild(item);
    }
}

button.addEventListener("click", generateNumbers);
</script>

</body>
</html>
